# 26.08.30修改，内容为：CI 工作流名称由 Fuwari-yCENzh CI 改为 FGmagi Blog CI，触发分支由 master 改为 main
name: FGmagi Blog CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Astro Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check
        env:
          ENABLE_CONTENT_SYNC: false

  build:
    name: Astro Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Build
        run: pnpm astro build
        env:
          ENABLE_CONTENT_SYNC: false

      # 26.11.03：搜索索引原本只存在于本地 `pnpm build` 的链路里（astro build && pagefind），
      # CI 直接调 `pnpm astro build` ⇒ 线上 dist 没有 /pagefind/，导航栏搜索会退化为空结果。
      # 这里补上同一份索引生成；与本地脚本使用同一 pagefind 默认配置（读取 pagefind.yml）。
      - name: Build Pagefind index
        run: pnpm exec pagefind --site dist
        env:
          ENABLE_CONTENT_SYNC: false

